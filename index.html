<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les fichiers d'aide</title>
<style>
/* ===== Menu (CSS d'origine) ===== */
#menu-container {
  float: left;
  width: 220px;
  padding: 15px;
  background: #cfcfcf;
  box-sizing: border-box;
}
#menu-container h2 { font-size: 18px; margin-top: 0; }
#menu-container ul { list-style: none; padding: 0; }
#menu-container li { margin-bottom: 10px; }
#menu-container a { text-decoration: none; color: #333; }

/* Contenu de la page */
#main-content {
  margin-left: 240px; /* laisse de la place pour le menu */
  padding: 40px;
  margin-right: auto;
  max-width: 1500px;
}
/* Lien actif du menu non utilisé */
#menu-container a.active { font-weight: bold; color: #007BFF; }

/* ===== CSS du EFS ===== */
body { font-family: Arial, sans-serif; padding: 0; margin: 0; max-width: 1000px; }
h1 { text-align: center; }
table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
th, td { border: 1px solid #ccc; padding: 0.5rem; text-align: center; }
.resultats { margin-top: 2rem; font-weight: bold; }
.controls { margin-top: 1rem; }

/* ===== CSS du EC EG ===== */
h2, h3 { margin-top: 25px; }
label { display: block; margin-top: 10px; width: 100px; }
.result { margin-top: 20px; padding: 10px; background: #f2f2f2; font-weight: bold; }
button { margin-top: 15px; padding: 8px 12px; cursor: pointer; }
.input-grand { width: 325px; padding: 6px; margin-top: 3px; box-sizing: border-box; }
.input-petit { width: 60px; padding: 6px; box-sizing: border-box; }

/* ===== Page surface de coude (préfixe cs-) ===== */
/* Thème sombre par défaut ; thème clair via data-theme="light" sur <html> */
:root {
  --cs-bg: #14171d; --cs-card: #1e232c; --cs-text: #e6e9ef; --cs-muted: #9aa3b5;
  --cs-accent: #4c8dff; --cs-border: #343b48; --cs-result: #1b2a42; --cs-err: #ff8a80;
}
:root[data-theme="light"] {
  --cs-bg: #f4f5f7; --cs-card: #ffffff; --cs-text: #1d2330; --cs-muted: #657086;
  --cs-accent: #1f6feb; --cs-border: #d5dae3; --cs-result: #e8f1ff; --cs-err: #b42318;
}
.cs-page { background: var(--cs-bg); color: var(--cs-text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.cs-app { max-width: 460px; margin: 0; padding: 0; }
.cs-app * { box-sizing: border-box; }
.cs-title { font-size: 1.4rem; margin: 0 0 4px; text-align: left; }
.cs-sub { color: var(--cs-muted); margin: 0 0 20px; font-size: .95rem; }
.cs-card { background: var(--cs-card); border: 1px solid var(--cs-border); border-radius: 14px; padding: 20px; }
.cs-app label { display: block; font-weight: 600; margin: 0 0 6px; font-size: .95rem; width: auto; }
.cs-field { margin-bottom: 16px; }
.cs-input-wrap { position: relative; }
.cs-app input { width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 56px 12px 14px; margin: 0;
  border: 1px solid var(--cs-border); border-radius: 10px; background: var(--cs-bg); color: var(--cs-text); }
.cs-app input:focus { outline: 2px solid var(--cs-accent); outline-offset: 1px; }
.cs-unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--cs-muted); font-size: .9rem; pointer-events: none; }
.cs-hint { color: var(--cs-muted); font-size: .82rem; margin-top: 4px; }
.cs-res { margin-top: 8px; background: var(--cs-result); border-radius: 12px; padding: 18px; text-align: center; }
.cs-res-label { color: var(--cs-muted); font-size: .9rem; }
.cs-res-value { font-size: 2.4rem; font-weight: 700; margin: 4px 0; color: var(--cs-accent); }
.cs-res-detail { font-size: .9rem; color: var(--cs-muted); min-height: 1.3em; }
.cs-error { color: var(--cs-err); font-size: .95rem; min-height: 1.3em; margin-top: 10px; text-align: center; }
.cs-footer { color: var(--cs-muted); font-size: .8rem; margin-top: 18px; text-align: center; }

/* ===== Page d'accueil ===== */
  .cs-index h1 { font-size: 1.6rem; margin: 0 0 24px; color: var(--cs-text); }
  .cs-index h2 { font-size: 1.2rem; margin: 28px 0 8px; color: var(--cs-accent); }
  .cs-index .cs-card { margin-bottom: 12px; }
  .cs-index p { margin: 0 0 10px; color: var(--cs-text); }
  .cs-index a.cs-link { color: var(--cs-accent); font-weight: 600; text-decoration: none; }
  .cs-index a.cs-link:hover { text-decoration: underline; }
</style>
</head>
<body class="cs-page">


  /* on supprime le menu
  <!-- Menu -->
  <div id="menu-container"></div>
*/
  
  <!-- Contenu principal -->
  <div id="main-content">
    <div class="cs-index">
      <h1>Les fichiers d'aide</h1>

      <h2>Sanitaire</h2>
      <div class="cs-card">
        <p>Dimensionnement EF logement</p>
        <a class="cs-link" href="https://ddschutz.github.io/job/EFS-LGT.html">Ouvrir le calcul EF</a>
      </div>

      <h2>Chauffage</h2>
      <div class="cs-card">
        <p>Dimensionnement EC/EG</p>
        <a class="cs-link" href="https://ddschutz.github.io/job/DIM_EC_EG.html">Ouvrir le dimensionnement EC/EG</a>
      </div>

      <h2>Quantité</h2>
      <div class="cs-card">
        <p>Calcul de la surface d'un coude</p>
        <a class="cs-link" href="https://ddschutz.github.io/job/coude-surface.html">Ouvrir le calcul de surface de coude</a>
      </div>
    </div>
  </div>

  <script>
fetch("menu.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("menu-container").innerHTML = data;
  });
  </script>
</body>
</html>
